# Start:            docker compose up -d --build
# Mit HTTPS (Server): docker compose --profile https up -d --build   (DOMAIN in .env setzen)

services:
  app:
    build: .
    image: cold-emails:latest
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATA_DIR: /app/data
    volumes:
      - cold_emails_data:/app/data
    ports:
      # Nur lokal erreichbar. Für den Zugriff von außen den HTTPS-Proxy (Caddy) verwenden.
      - "127.0.0.1:3000:3000"

  caddy:
    image: caddy:2
    profiles: ["https"]
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  cold_emails_data:
  caddy_data:
  caddy_config:
